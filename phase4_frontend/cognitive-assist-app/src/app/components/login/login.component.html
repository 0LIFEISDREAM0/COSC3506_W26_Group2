<div class="login-container">
    <div class="login-card">
        <h1>CogniAssist</h1>
        <p class="subtitle">Focused Reading for Cognitive Support</p>

        <form (ngSubmit)="onLogin()">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input id="email" type="email" class="form-control" [(ngModel)]="email" name="email"
                    placeholder="Enter your email" [disabled]="loading" />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" class="form-control" [(ngModel)]="password" name="password"
                    placeholder="Enter your password" [disabled]="loading" />
            </div>

            <div *ngIf="error" class="alert alert-danger" role="alert">
                {{ error }}
            </div>

            <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
                <span *ngIf="!loading">Sign In</span>
                <span *ngIf="loading">
                    <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                    Signing In...
                </span>
            </button>
        </form>

        <div class="text-center mt-3">
            <p>Don't have an account?
                <a href="#" (click)="goToRegister(); $event.preventDefault()" class="link">
                    Create one
                </a>
            </p>
        </div>
    </div>
</div>
